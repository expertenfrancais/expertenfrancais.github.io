<script src="data.js"></script>
<script>
$("cam").innerHTML=ico("cam",16);
$("editBtn").innerHTML=ico("pen",16)+"Modifier le profil";
$("logout").innerHTML=ico("out",20)+"Se déconnecter";
$("pick").innerHTML=ico("cam",16)+"&nbsp;Changer la photo";
$("pickCover").innerHTML=ico("cam",16)+"&nbsp;Changer la couverture";
$("i-set").innerHTML=ico("gear",20);
$("i-share").innerHTML='<svg width="20" height="20" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>';
var teacher=ROLE==="enseignant";
$("fGrade").innerHTML='<option value="">Choisir…</option>'+accessibleCycles().map(function(c){return '<optgroup label="'+c+'">'+CYCLES[c].map(function(n){return "<option>"+n+"</option>"}).join("")+"</optgroup>"}).join("");
$("forT").hidden=!teacher;$("forE").hidden=teacher;
if(homeCycle())$("fSubject").placeholder="Ex. "+CYCLES[homeCycle()].slice(0,2).join(", ");

function nav(){drawNav(4)}
function paintSub(){
 var on=isSubscribed(),s=ls("sub",{}),pl=PLANS.filter(function(x){return x.id===s.plan})[0],ds=on?Math.ceil((Date.parse(s.end)-Date.now())/864e5):0;
 var bs=$("bSub");bs.textContent=on?"Abonné":"Sans abonnement";bs.className="bd1"+(on?"":" off");
 $("subc").innerHTML="<b>"+(on?"Abonnement actif ✓ · "+esc(pl?pl.n:""):"Pas d’abonnement")+"</b><span>"+(on?"Valable jusqu’au "+fmtDate(s.end)+" · "+ds+" jour"+(ds>1?"s":"")+" restant"+(ds>1?"s":""):(GRATUIT?"Les cours sont gratuits ; l’abonnement donne accès aux fiches pédagogiques complètes.":"Accédez à tout le contenu sans achat à l’unité."))+"</span><em>"+(on?"Gérer ›":"Voir les formules ›")+"</em>";
 var ok=DOCS.map(function(d){return d.id}),inOk=function(i){return ok.indexOf(i)>-1},bought=ls("bought",[]).filter(inOk),studied=ls("studied",[]).filter(function(i){return inOk(i)&&canAccess(i)});
 var mine=DOCS.filter(function(d){return canAccess(d.id)&&(bought.indexOf(d.id)>-1||studied.indexOf(d.id)>-1)});
 $("mine").innerHTML=mine.length?mine.map(function(d){var g=G[d.k]||G.Cours,stu=studied.indexOf(d.id)>-1;
  return '<a class="pc" href="'+docUrl(d)+'" style="--g1:'+g[0]+';--g2:'+g[1]+'"><div class="t"><img src="'+esc(d.img)+'" alt="" loading="lazy" onerror="this.remove()"></div><div style="min-width:0"><b>'+esc(d.t)+'</b><span class="c">'+esc(d.k)+" · "+esc(d.n)+'</span><span class="s">'+(stu?"Étudié ✓":(GRATUIT?"Gratuit":on?"Inclus":"Acheté"))+"</span></div></a>"}).join(""):
  '<a class="emptyc" href="catalogue.html"><b>Aucun document pour l’instant</b><span>Parcourir le catalogue ›</span></a>';
 var accN=on?DOCS.length:bought.length,R=[["Étudiés","#8c6fe0",studied.length,accN],["Achetés","#2fa883",bought.length,DOCS.length],["Favoris","#5f84e6",favs.filter(inOk).length,DOCS.length]];
 $("rings").innerHTML=R.map(function(r){var p=r[3]?Math.round(100*r[2]/r[3]):0;
  return '<div class="rg"><b style="color:'+r[1]+'">'+r[0]+'</b><div class="ring" style="--c:'+r[1]+';--v:'+p+'"><i>'+p+' %</i></div><small>'+r[2]+" / "+r[3]+"</small></div>"}).join("");paintResults()}

/* Mes résultats : réussite aux quiz et exercices, et parties à revoir (scores enregistrés dans la leçon) */
function paintResults(){
 var el=$("res");if(!el)return;
 var all=ls("scores",{}),qa=0,qo=0,ea=0,eo=0,weak=[];
 DOCS.forEach(function(d){
  var c=all[d.id];if(!c||!canAccess(d.id))return;
  Object.keys(c).forEach(function(k){
   var s=scoreSum(c[k]);qa+=s.qa;qo+=s.qo;ea+=s.ea;eo+=s.eo;
   var rq=s.qa?s.qo/s.qa:1,re=s.ea?s.eo/s.ea:1;
   if((s.qa&&rq<.6)||(s.ea&&re<.5))weak.push({d:d,i:+k,r:Math.min(rq,re)})})});
 if(!qa&&!ea){el.innerHTML='<div class="resempty">Faites les quiz et les exercices des parties de vos cours : votre taux de réussite et les parties à revoir apparaîtront ici.</div>';return}
 weak.sort(function(a,b){return a.r-b.r});
 var h='<div class="stats"><div class="stat"><b>'+(qa?Math.round(100*qo/qa)+" %":"–")+'</b><span>Quiz réussis</span></div>'+
  '<div class="stat"><b>'+(ea?Math.round(100*eo/ea)+" %":"–")+'</b><span>Exercices réussis</span></div>'+
  '<div class="stat"><b>'+weak.length+'</b><span>À revoir</span></div></div>';
 if(weak.length){h+='<p class="wkh">À revoir en priorité</p>'+weak.slice(0,3).map(function(w){
  var sec=docInfo(w.d).sections[w.i],t=sec?sec.t:"Partie "+(w.i+1);
  return '<a class="wk" href="'+partUrl(w.d,w.i)+'"><div><b>Partie '+(w.i+1)+' · '+esc(t)+'</b><small>'+esc(w.d.t)+'</small></div><em>'+Math.round(100*w.r)+' %</em></a>'}).join("")}
 el.innerHTML=h}

/* E-mail du compte (lecture seule, venant de la connexion) */
function accountEmail(){try{var s=JSON.parse(localStorage.getItem("sb_session")||"null");return(s&&s.email)||""}catch(e){return""}}

/* Informations affichées */
function infoRows(){
 var p=userProfile(),rows=[];
 if(p.first)rows.push(["Prénom",p.first]);
 if(p.last)rows.push(["Nom de famille",p.last]);
 var em=p.email||accountEmail();
 if(em)rows.push(["E-mail",em]);
 if(p.tel)rows.push(["Téléphone",p.tel]);
 if(p.city)rows.push(["Ville",p.city]);
 if(p.school)rows.push(["Établissement",p.school]);
 if(homeCycle())rows.push(["Cycle",homeCycle()+(canSwitchCycle()&&activeCycle()!==homeCycle()?" (affiché : "+activeCycle()+")":"")]);
 if(teacher&&p.subject)rows.push(["Classes enseignées",p.subject]);
 if(!teacher&&p.grade)rows.push(["Niveau",p.grade]);
 return rows}

function render(){
 var n=userName(),l=(n||"E").charAt(0).toUpperCase();
 $("nm").textContent=n||ROLES[ROLE];
 $("bigL").textContent=l;
 $("role").textContent=ROLES[ROLE];
 $("acc").textContent=teacher?"Accès gratuit à toutes les ressources : cours, fiches, programmes, évaluations et exercices.":"Accès gratuit à l’ensemble des cours.";
 var rows=infoRows();
 $("info").innerHTML=rows.length?rows.map(function(r){return '<div class="irow"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'}).join(""):
  '<p class="none">Complétez votre profil pour personnaliser votre espace.</p>';
 
 var t="auto";try{t=localStorage.getItem("theme")||"auto"}catch(e){}
 document.querySelectorAll("#theme .chip").forEach(function(c){c.classList.toggle("on",c.dataset.v===t)});
 $("cycTxt").textContent=canSwitchCycle()?"Vous pouvez consulter les cours de tous les cycles.":"Vous avez accès aux cours du cycle « "+homeCycle()+" ». Avec un abonnement, vous pouvez passer d’un cycle à l’autre.";
 paintSub();paintAvatars();paintCover();nav()}

/* Photo de profil : recadrée au carré et réduite avant d’être enregistrée */
function readPhoto(file){
 if(!file)return;
 if(!/^image\//.test(file.type))return toast("Choisissez une image");
 var fr=new FileReader();
 fr.onload=function(){var im=new Image();
  im.onload=function(){
   var S=256,c=document.createElement("canvas");c.width=c.height=S;
   var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
   c.getContext("2d").drawImage(im,sx,sy,m,m,0,0,S,S);
   var url=c.toDataURL("image/jpeg",.85);
   try{localStorage.setItem("user_photo",url)}catch(e){return toast("Photo trop lourde pour être enregistrée")}
   render();toast("Photo enregistrée ✓")};
  im.onerror=function(){toast("Image illisible")};
  im.src=fr.result};
 fr.onerror=function(){toast("Lecture impossible")};
 fr.readAsDataURL(file)}
$("big").onclick=$("pick").onclick=function(){$("file").click()};
$("file").onchange=function(){readPhoto(this.files&&this.files[0]);this.value=""};
$("unpick").onclick=function(){try{localStorage.removeItem("user_photo")}catch(e){}render();toast("Photo retirée")};

/* Photo de couverture : recadrée au format bandeau et réduite avant d’être enregistrée */
function userCover(){try{return localStorage.getItem("user_cover")||""}catch(e){return""}}
function paintCover(){
 var c=userCover(),h=$("hero");
 if(c){h.style.backgroundImage='linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 55%),url("'+c+'")';h.classList.add("ph")}
 else{h.style.backgroundImage="";h.classList.remove("ph");
  landDefault("c",function(u){if(userCover())return;h.style.backgroundImage='linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 55%),url("'+u+'")';h.classList.add("ph")})}
 $("uncover").hidden=!c}
function readCover(file){
 if(!file)return;
 if(!/^image\//.test(file.type))return toast("Choisissez une image");
 var fr=new FileReader();
 fr.onload=function(){var im=new Image();
  im.onload=function(){
   var W=860,H=340,c=document.createElement("canvas");c.width=W;c.height=H;
   var r=W/H,sw=im.width,sh=im.height;
   if(sw/sh>r)sw=sh*r;else sh=sw/r;
   c.getContext("2d").drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,W,H);
   var url=c.toDataURL("image/jpeg",.8);
   try{localStorage.setItem("user_cover",url)}catch(e){return toast("Image trop lourde pour être enregistrée")}
   render();toast("Couverture enregistrée ✓")};
  im.onerror=function(){toast("Image illisible")};
  im.src=fr.result};
 fr.onerror=function(){toast("Lecture impossible")};
 fr.readAsDataURL(file)}
$("heroEdit").onclick=$("pickCover").onclick=function(){$("fileCover").click()};
$("fileCover").onchange=function(){readCover(this.files&&this.files[0]);this.value=""};
$("uncover").onclick=function(){try{localStorage.removeItem("user_cover")}catch(e){}render();toast("Couverture retirée")};

/* Partager l’application */
$("share").onclick=function(){
 var url=(location.protocol==="https:"&&location.hostname.indexOf("localhost")<0)?location.origin+"/":"https://expertenfrancais.github.io/";
 if(navigator.share){navigator.share({title:"Expert en français",text:"Expert en français : cours de français du primaire à l’université.",url:url}).catch(function(){})}
 else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){toast("Lien copié ✓")},function(){toast(url)})}
 else toast(url)};

/* Modification des informations */
function openEdit(){
 var p=userProfile();
 $("fName").value=userName();$("fFirst").value=p.first||"";$("fLast").value=p.last||"";$("fEmail").value=p.email||accountEmail();$("fTel").value=p.tel||"";$("fCity").value=p.city||"";$("fSchool").value=p.school||"";
 $("fSubject").value=p.subject||"";$("fGrade").value=p.grade||"";
 $("edit").hidden=false;$("editBtn").hidden=true}
function closeEdit(){$("edit").hidden=true;$("editBtn").hidden=false}
$("editBtn").onclick=openEdit;$("cancel").onclick=closeEdit;
$("save").onclick=function(){
 var name=$("fName").value.trim();
 if(!name)return toast("Saisissez un nom");
 var em=$("fEmail").value.trim();
 if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast("Adresse e-mail invalide");
 var p={first:$("fFirst").value.trim(),last:$("fLast").value.trim(),email:em,tel:$("fTel").value.trim(),city:$("fCity").value.trim(),school:$("fSchool").value.trim()};
 if(teacher)p.subject=$("fSubject").value.trim();else p.grade=$("fGrade").value;
 try{localStorage.setItem("user_name",name)}catch(e){}
 sv("user_profile",p);closeEdit();render();toast("Profil enregistré ✓")};

$("theme").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;
 try{if(b.dataset.v==="auto")localStorage.removeItem("theme");else localStorage.setItem("theme",b.dataset.v)}catch(x){}
 applyTheme();render()};
$("logout").onclick=function(){if(!confirm(window.syncOn&&syncOn()?"Se déconnecter efface les données de cet appareil. Vos favoris, panier et progression sont sauvegardés sur votre compte et reviendront à votre prochaine connexion. Continuer ?":"Se déconnecter effacera vos favoris, achats, abonnement et progression enregistrés sur cet appareil. Continuer ?"))return;(window.syncBeforeLogout?syncBeforeLogout():Promise.resolve()).then(function(){["user_name","user_role","user_photo","user_cover","user_profile","favs","cart","bought","pending","sub","subpending","studied","parts","scores","user_cycle","view_cycle","rates","sb_session","sb_conf","auth_mode","sync_at","sync_dirty"].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});location.href="login-app.html"})};
$("nav").onclick=navClick;
/* Installation et mode hors ligne */
function appCard(){
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),t;
 $("installBtn").hidden=!deferredInstall;
 if(isStandalone())t="Application installée ✓ Vos pages déjà visitées restent disponibles sans internet.";
 else if(deferredInstall)t="Installez l’application sur votre téléphone : elle s’ouvre comme une application et reste disponible sans internet.";
 else if(ios)t="Pour installer l’application sur iPhone : touchez Partager, puis « Sur l’écran d’accueil ».";
 else t="Pour installer l’application, utilisez le menu de votre navigateur (« Installer l’application » ou « Ajouter à l’écran d’accueil »).";
 $("appTxt").textContent=t}
$("installBtn").onclick=function(){installApp().then(function(ok){if(ok)toast("Application installée ✓");appCard()})};
document.addEventListener("installready",appCard);document.addEventListener("installdone",appCard);
appCard();
$("heroEdit").innerHTML=ico("cam",18);
render();
</script>
