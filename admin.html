.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:r .7s linear infinite;display:none}
.load .spin{display:block}@keyframes r{to{transform:rotate(360deg)}}
.center{text-align:center;padding:20px 6px}

@media(min-width:500px) and (min-height:640px) and (hover:hover) and (pointer:fine){.nav{position:sticky;left:auto;right:auto;width:auto;max-width:none;margin:auto 0 0}main{padding-bottom:30px!important}}

body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

.toast.show{opacity:1;transform:translate(-50%,0)}
.av.ph{color:transparent;font-size:0}
[hidden]{display:none!important}
.plan{display:block;width:100%;text-align:left;font:inherit;color:inherit;border:2px solid transparent;cursor:pointer}.plan.on{border-color:#8c6fe0}.plan .r{display:flex;justify-content:space-between;gap:8px}.plan small{color:var(--sub)}.plan em{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#2fa883;border-radius:10px;padding:2px 8px;margin-left:6px}

.cxlbtns{display:flex;gap:8px}

.mini.keep{background:var(--card);color:var(--ink)}.mini.del{background:#d0426a;color:#fff}.mini:disabled{opacity:.7}

.sec{margin:22px 4px 10px;font-size:16px;color:var(--ink)}
.st{padding:16px;margin-bottom:6px}.st b{display:block;font-size:16px;color:var(--ink)}.st small{color:var(--sub)}
.steps{margin:0 0 14px;padding:0 4px 0 22px;color:var(--ink);font-size:14px;line-height:1.6}
.codebox{padding:14px}.codebox input{width:100%;box-sizing:border-box;height:52px;border:2px solid transparent;border-radius:16px;background:var(--field);color:var(--ink);font:600 18px/1 ui-monospace,Menlo,monospace;letter-spacing:2px;text-align:center;text-transform:uppercase;margin-bottom:12px}
.codebox input:focus{outline:0;border-color:#8c6fe0}.codebox .err{min-height:18px;margin:10px 0 0;font-size:13.5px;color:#d0426a;text-align:center}
.hint{margin:14px 4px 0;font-size:13px;color:var(--sub);text-align:center}
.ad .sel,.ad .num{width:100%;box-sizing:border-box;height:48px;border:2px solid transparent;border-radius:16px;background:var(--field);color:var(--ink);font:inherit;font-size:15px;padding:0 14px;margin-bottom:10px}
.ad .row2{display:flex;gap:8px}.ad .row2>*{flex:1}
.gen{width:100%;box-sizing:border-box;min-height:110px;border:0;border-radius:16px;background:var(--field);color:var(--ink);font:600 15px/1.7 ui-monospace,Menlo,monospace;padding:12px;margin:10px 0;resize:vertical}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.flt button{border:0;border-radius:16px;padding:8px 14px;background:var(--field);color:var(--ink);font-weight:600;font-size:13px}.flt button.on{background:#8c6fe0;color:#fff}
.cd{padding:12px;margin-bottom:8px}.cd .t{display:flex;justify-content:space-between;gap:8px;align-items:center}.cd code{font:700 15px ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--ink)}
.cd small{display:block;color:var(--sub);margin-top:4px}.cd .b{display:flex;gap:6px;margin-top:8px}
.cd .b button{flex:1;height:38px;border:0;border-radius:14px;background:var(--field);color:var(--ink);font-weight:600;font-size:13px}.cd .b .x{color:#d0426a}
.cd .nt{width:100%;box-sizing:border-box;height:38px;border:0;border-radius:12px;background:var(--field);color:var(--ink);font:inherit;font-size:13.5px;padding:0 10px;margin-top:8px}
.pill2{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;color:#fff;background:#2fa883}.pill2.u{background:#8c6fe0}.pill2.a{background:#9a9aa8}
.ad .m{margin:8px 4px;font-size:13.5px;color:var(--sub);text-align:center}

.tabs{display:flex;gap:6px;margin:0 0 6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:1 0 auto;white-space:nowrap;border:0;border-radius:16px;padding:10px 12px;background:var(--field);color:var(--ink);font-weight:600;font-size:13px}.tabs button.on{background:#8c6fe0;color:#fff}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.kpi .card{margin:0;padding:14px;text-align:center}.kpi b{display:block;font-size:26px;color:var(--ink)}.kpi small{color:var(--sub);font-size:12px}
.br{margin-bottom:10px}.br .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink)}.br .tr{height:8px;border-radius:4px;background:var(--field);margin-top:4px;overflow:hidden}.br .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2));border-radius:4px}
.lst{margin:0;padding:0;list-style:none}.lst li{padding:8px 0;border-top:1px solid rgba(107,100,144,.2);font-size:13.5px;color:var(--ink)}.lst li:first-child{border-top:0}.lst small{display:block;color:var(--sub)}
.pg .sr{width:100%;height:42px;border:0;border-radius:14px;background:var(--field);color:var(--ink);font:inherit;font-size:14px;padding:0 14px;margin:0 0 10px}
.pg .u{display:block;margin-top:6px;font-size:12px;color:var(--link);word-break:break-all;user-select:all;-webkit-user-select:all}
.pg .b{display:flex;gap:6px;margin-top:8px}.pg .b button,.pg .b a{flex:1;height:38px;border:0;border-radius:14px;background:var(--field);color:var(--ink);font-weight:600;font-size:13px;display:grid;place-items:center;text-decoration:none}
.pg .tot{display:flex;gap:6px;margin:0 0 12px}.pg .tot button{flex:1;height:44px;border:0;border-radius:16px;font-weight:600;font-size:13px;color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2))}.pg .tot button.alt{background:var(--field);color:var(--ink)}
.good{color:#2fa883;font-weight:700}.bad{color:#d0426a;font-weight:700}
.ad .btn2{width:100%;height:48px;border:0;border-radius:24px;font-weight:600;font-size:15px;color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));margin:4px 0 10px}.ad .btn2:disabled{opacity:.7}
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <div class="who"><div class="av" id="av">E</div><div style="min-width:0"><small>Réservé à l’administrateur</small><b id="ttl">Codes d’activation</b></div></div>
    <button class="ib" id="bell" type="button" aria-label="Notifications"><svg width="22" height="22" viewBox="0 0 24 24"><path id="p-bell"/></svg></button>
  </header>
  <main class="ad">
    <section id="vNo" class="center" hidden>
      <h3 id="noTtl">Accès réservé</h3>
      <p id="noMsg">Cette page est réservée à l’administrateur.</p>
      <button class="btn" id="retry" type="button" hidden>Réessayer</button>
    </section>
    <section id="vAd" hidden>
      <div class="tabs" id="tabs"><button type="button" data-t="codes" class="on">Codes</button><button type="button" data-t="vue">Vue d’ensemble</button><button type="button" data-t="sante">Doublons et santé</button><button type="button" data-t="pages">Pages publiées</button></div>
      <div id="tCodes">
      <h3 class="sec">Générer des codes</h3>
      <div class="card" style="padding:14px">
        <select class="sel" id="profil"><option value="enseignant">Enseignant</option><option value="eleve">Élève</option></select>
        <select class="sel" id="plan"></select>
        <input class="num" id="nb" type="number" min="1" max="200" value="10" inputmode="numeric" aria-label="Nombre de codes">
        <button class="btn" id="gen" type="button">Générer</button>
        <textarea class="gen" id="out" readonly hidden></textarea>
        <button class="btn" id="copyall" type="button" hidden>Copier tous les codes</button>
      </div>
      <h3 class="sec">Mes codes</h3>
      <div class="flt" id="flt"><button data-s="" class="on">Tous</button><button data-s="libre">Libres</button><button data-s="utilise">Utilisés</button><button data-s="annule">Annulés</button></div>
      <div id="list"></div>
      <p class="m" id="msg"></p>
      </div>
      <div id="tVue" hidden></div>
      <div id="tSante" hidden></div>
      <div id="tPages" class="pg" hidden></div>
    </section>
  </main>
  <nav class="nav" id="nav"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>var PAGE_ABO=1;</script>
<script src="data.js"></script>
<script>
$("p-bell").setAttribute("d",IC.bell);
var n0=userName();if(n0)$("av").textContent=n0.charAt(0).toUpperCase();
function nav(){drawNav(4)}
var statut="",NOMS={mois:"Mensuel",trim:"Trimestriel",an:"Annuel"},TARIFS={enseignant:{mois:2500,trim:5000,an:10000},eleve:{mois:1000,trim:2000,an:3000}};
function fillPlans(){var p=$("profil").value,cur=$("plan").value||"mois";$("plan").innerHTML=["mois","trim","an"].map(function(k){return '<option value="'+k+'">'+NOMS[k]+' · '+price(TARIFS[p][k])+'</option>'}).join("");$("plan").value=cur}
$("profil").onchange=fillPlans;fillPlans();
function copier(t,ok){
 function fin(){toast(ok||"Copié ✓")}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(fin,function(){toast("Copie impossible : sélectionnez le texte")})}
 else{var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");fin()}catch(e){toast("Copie impossible")}a.remove()}}
function charger(){
 $("msg").textContent="Chargement…";
 return sbRpc("admin_lister_codes",{p_statut:statut||null,p_limite:200}).then(function(rows){
  $("msg").textContent=rows.length?rows.length+" code"+(rows.length>1?"s":"")+(rows.length>=200?" (200 derniers)":""):"Aucun code.";
  $("list").innerHTML=rows.map(function(r){
   var st=r.statut==="libre"?'<span class="pill2">Libre</span>':r.statut==="utilise"?'<span class="pill2 u">Utilisé</span>':'<span class="pill2 a">Annulé</span>';
   return '<div class="card cd" data-c="'+esc(r.code)+'"><div class="t"><code>'+esc(r.code)+'</code>'+st+'</div>'+
    '<small>'+(r.profil==='eleve'?'Élève':'Enseignant')+' · '+esc(NOMS[r.plan]||r.plan)+' · '+esc(price(r.prix))+(r.statut==="utilise"?' · '+esc(r.utilisateur||"compte supprimé")+' · '+esc(fmtDate(r.utilise_le)):'')+'</small>'+
    '<input class="nt" type="text" maxlength="200" placeholder="Note (ex. nom du client)" value="'+esc(r.note||"")+'">'+
    '<div class="b"><button data-a="copy">Copier</button>'+(r.statut==="libre"?'<button data-a="cancel" class="x">Annuler</button>':'')+'</div></div>'}).join("")})
 .catch(function(){$("msg").textContent="Impossible de charger les codes."})}
$("gen").onclick=function(){
 var nb=parseInt($("nb").value,10);if(!(nb>=1&&nb<=200)){toast("Choisissez un nombre entre 1 et 200");return}
 var b=$("gen");b.disabled=true;
 sbRpc("admin_generer_codes",{p_plan:$("plan").value,p_profil:$("profil").value,p_nombre:nb}).then(function(c){
  $("out").hidden=false;$("copyall").hidden=false;$("out").value=c.join("\n");toast(c.length+" code"+(c.length>1?"s":"")+" créé"+(c.length>1?"s":""));return charger()})
 .catch(function(){toast("Échec de la génération")}).then(function(){b.disabled=false})};
$("copyall").onclick=function(){copier($("out").value,"Codes copiés ✓")};
$("flt").onclick=function(e){var b=e.target.closest("button");if(!b)return;statut=b.dataset.s;
 document.querySelectorAll("#flt button").forEach(function(x){x.classList.toggle("on",x===b)});charger()};
$("list").onclick=function(e){var b=e.target.closest("button");if(!b)return;var card=b.closest(".cd"),code=card.dataset.c;
 if(b.dataset.a==="copy")copier(code);
 else if(b.dataset.a==="cancel"&&confirm("Annuler le code "+code+" ? Il ne pourra plus être activé."))
  sbRpc("admin_annuler_code",{p_code:code}).then(function(ok){toast(ok?"Code annulé":"Code déjà utilisé");charger()}).catch(function(){toast("Échec")})};
$("list").addEventListener("change",function(e){if(!e.target.classList.contains("nt"))return;var code=e.target.closest(".cd").dataset.c;
 sbRpc("admin_noter_code",{p_code:code,p_note:e.target.value}).then(function(){toast("Note enregistrée")}).catch(function(){toast("Échec")})});

/* ===== Tableau de bord : vue d’ensemble, doublons, santé du site ===== */
var TYPES=["Cours","Fiches","Exercices","Évaluations","Annales","Programmes"];
function norm(t){return String(t||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function cnt(arr,f){var o={};arr.forEach(function(d){var k=f(d);o[k]=(o[k]||0)+1});return o}
function bars(o,order){var ks=order||Object.keys(o).sort(function(a,b){return o[b]-o[a]}),mx=1;ks.forEach(function(k){if((o[k]||0)>mx)mx=o[k]});
 return ks.map(function(k){var v=o[k]||0;return '<div class="br"><div class="l"><span>'+esc(k)+'</span><b>'+v+'</b></div><div class="tr"><i style="width:'+Math.round(v*100/mx)+'%"></i></div></div>'}).join("")}
function lbl(d){return esc(d.t)+'<small>n° '+esc(d.id)+' · '+esc(d.k)+' · '+esc(d.n)+(d.m?' · '+esc(d.m):'')+'</small>'}
function groupes(f){var g={};ALLDOCS.forEach(function(d){var k=f(d);(g[k]=g[k]||[]).push(d)});return Object.keys(g).filter(function(k){return g[k].length>1}).map(function(k){return g[k]})}
function blocGroupes(titre,gs,ok){
 var h='<div class="card"><h4>'+titre+'</h4>';
 if(!gs.length)return h+'<p class="good" style="margin:0">'+ok+'</p></div>';
 return h+'<ul class="lst">'+gs.map(function(g){return '<li>'+g.map(function(d){return '<span style="display:block">'+lbl(d)+'</span>'}).join('')+'</li>'}).join('')+'</ul></div>'}
function renderVue(){
 var A=ALLDOCS,ct=cnt(A,function(d){return d.k}),cours=A.filter(function(d){return d.k==="Cours"});
 var maxId={};A.forEach(function(d){if(!(maxId[d.k]>=d.id))maxId[d.k]=d.id});
 var rec=cours.slice().sort(function(a,b){return b.id-a.id}).slice(0,8);
 var ens=A.filter(function(d){return d.k==="Fiches"||d.k==="Évaluations"||d.k==="Programmes"}).length;
 var acces=(typeof GRATUIT!=="undefined"&&GRATUIT)?"Gratuit pour tous"+((typeof FICHES_VERROU!=="undefined"&&FICHES_VERROU)?" (fiches : aperçu gratuit, suite sur abonnement)":""):"Sur abonnement";
 $("tVue").innerHTML=
  '<h3 class="sec">Le site en ce moment</h3>'+
  '<div class="kpi"><div class="card"><b>'+A.length+'</b><small>pages publiées</small></div><div class="card"><b id="kVer">…</b><small>version du site</small></div>'+
  '<div class="card"><b>'+ct.Cours+'</b><small>cours</small></div><div class="card"><b>'+ens+'</b><small>réservées aux enseignants</small></div></div>'+
  '<div class="card"><div class="row"><span>Mode d’accès</span><b style="text-align:right">'+esc(acces)+'</b></div><div class="row" style="margin:0"><span>Catalogue mis à jour</span><b id="kDate">…</b></div></div>'+
  '<h3 class="sec">Par type de contenu</h3><div class="card">'+bars(ct,TYPES.filter(function(k){return ct[k]}))+'</div>'+
  '<h3 class="sec">Par niveau</h3><div class="card">'+bars(cnt(A,function(d){return d.n}),["CM2","6e","5e","4e","3e"].filter(function(k){return A.some(function(d){return d.n===k})}))+'</div>'+
  '<h3 class="sec">Cours par matière</h3><div class="card">'+bars(cnt(cours,function(d){return d.m}))+'</div>'+
  '<h3 class="sec">Derniers cours ajoutés</h3><div class="card"><ul class="lst">'+rec.map(function(d){return '<li>'+lbl(d)+'</li>'}).join("")+'</ul></div>'+
  '<h3 class="sec">Prochain numéro à utiliser</h3><div class="card">'+TYPES.map(function(k){return '<div class="row"><span>'+esc(k)+'</span><b>'+(maxId[k]!==undefined?(maxId[k]+1):"—")+'</b></div>'}).join("")+'</div>';
 fetch(BASE+"sw.js",{cache:"no-store"}).then(function(r){var d=r.headers.get("last-modified");return r.text().then(function(t){return{t:t,d:d}})}).then(function(x){
  var m=x.t.match(/VERSION\s*=\s*"([^"]+)"/);$("kVer").textContent=m?m[1]:"?";
  $("kDate").textContent=x.d?fmtDate(x.d):"inconnue"}).catch(function(){$("kVer").textContent="?";$("kDate").textContent="inconnue"})}
var verifEnCours=false;
function renderSante(){
 var exact=groupes(function(d){return d.k+"|"+d.n+"|"+norm(d.t)});
 var idsD=groupes(function(d){return d.id});
 var fichD=groupes(function(d){return contentFile(d)});
 var proches=groupes(function(d){return d.k+"|"+norm(d.t)}).filter(function(g){return g.some(function(d){return d.n!==g[0].n})&&!exact.some(function(e){return e[0]===g[0]})});
 var nb=exact.length+idsD.length+fichD.length;
 $("tSante").innerHTML=
  '<h3 class="sec">Doublons</h3>'+
  '<div class="card st"><b class="'+(nb?"bad":"good")+'">'+(nb?nb+" doublon"+(nb>1?"s":"")+" à corriger":"Aucun doublon détecté")+'</b><small>'+ALLDOCS.length+' pages analysées</small></div>'+
  blocGroupes("Même type, même niveau, même titre",exact,"Aucun titre en double.")+
  blocGroupes("Même numéro (id) utilisé deux fois",idsD,"Aucun numéro en double.")+
  blocGroupes("Même fichier de contenu utilisé deux fois",fichD,"Aucun fichier partagé.")+
  blocGroupes("Même titre sur plusieurs niveaux (souvent voulu)",proches,"Aucun.")+
  '<h3 class="sec">Santé du site</h3><div class="card"><p class="hint" style="margin:0 0 10px;text-align:left">Vérifie que chaque page du catalogue a bien son fichier de contenu et sa page publiée. Quelques secondes.</p><button class="btn2" id="verif" type="button">Vérifier les fichiers</button><p class="m" id="vmsg"></p><div id="vres"></div></div>';
 $("verif").onclick=verifier}
function verifier(){
 if(verifEnCours)return;verifEnCours=true;var b=$("verif");b.disabled=true;$("vres").innerHTML="";
 var jobs=[];ALLDOCS.forEach(function(d){jobs.push({d:d,f:contentFile(d),w:"contenu"});jobs.push({d:d,f:docFile(d),w:"page"})});
 var i=0,fait=0,manque=[];
 function un(){if(i>=jobs.length)return Promise.resolve();var j=jobs[i++];
  return fetch(BASE+j.f,{method:"HEAD",cache:"no-store"}).then(function(r){if(!r.ok)manque.push(j)},function(){manque.push(j)}).then(function(){fait++;if(fait%10===0||fait===jobs.length)$("vmsg").textContent=fait+" / "+jobs.length+" fichiers contrôlés…"}).then(un)}
 var pool=[];for(var k=0;k<6;k++)pool.push(un());
 Promise.all(pool).then(function(){
  $("vmsg").innerHTML=manque.length?'<span class="bad">'+manque.length+' fichier'+(manque.length>1?'s':'')+' introuvable'+(manque.length>1?'s':'')+'</span>':'<span class="good">Tout est en place : '+jobs.length+' fichiers trouvés ✓</span>';
  $("vres").innerHTML=manque.length?'<ul class="lst">'+manque.map(function(j){return '<li>'+lbl(j.d)+'<small>'+(j.w==="page"?"Page publiée":"Contenu")+' manquant : '+esc(j.f)+'</small></li>'}).join("")+'</ul>':"";
  b.disabled=false;verifEnCours=false})}

/* ===== Pages publiées : liste des adresses, avec copie ===== */
var PG_FILTRE="Tous",PG_Q="",PG_LISTE=[];
function pagesPubliees(){
 var url=function(f){return new URL(BASE+f,location.href).href};
 var site=["index.html","catalogue.html","abonnement.html"].map(function(f){return{t:f,k:"Site",n:"—",u:url(f),sub:"Page du site"}});
 var docs=ALLDOCS.map(function(d){return{t:d.t,k:d.k,n:d.n,u:url(docFile(d)),sub:"n° "+d.id+" · "+d.k+" · "+d.n+(d.m?" · "+d.m:"")}});
 return site.concat(docs)}
function pgFiltrees(){
 var q=norm(PG_Q);
 return PG_LISTE.filter(function(x){return(PG_FILTRE==="Tous"||x.k===PG_FILTRE)&&(!q||norm(x.t+" "+x.sub+" "+x.u).indexOf(q)>=0)})}
function renderPagesListe(){
 var L=pgFiltrees();
 $("pgCount").textContent=L.length+" page"+(L.length>1?"s":"")+(L.length<PG_LISTE.length?" sur "+PG_LISTE.length:"");
 $("pgList").innerHTML=L.map(function(x,i){return '<div class="card cd" data-i="'+i+'"><div class="t"><b>'+esc(x.t)+'</b></div><small>'+esc(x.sub)+'</small><span class="u">'+esc(x.u)+'</span><div class="b"><button type="button" data-a="copy">Copier</button><a href="'+esc(x.u)+'" target="_blank" rel="noopener">Ouvrir</a></div></div>'}).join("")||'<p class="m">Aucune page.</p>'}
function renderPages(){
 PG_LISTE=pagesPubliees();
 var ct=cnt(PG_LISTE,function(x){return x.k}),ks=["Tous"].concat(["Site"].concat(TYPES).filter(function(k){return ct[k]}));
 $("tPages").innerHTML=
  '<h3 class="sec">Pages publiées</h3>'+
  '<input class="sr" id="pgQ" type="search" placeholder="Rechercher (titre, numéro, adresse)" autocomplete="off">'+
  '<div class="flt" id="pgFlt">'+ks.map(function(k){return '<button type="button" data-k="'+esc(k)+'"'+(k===PG_FILTRE?' class="on"':'')+'>'+esc(k)+(k==="Tous"?"":" ("+ct[k]+")")+'</button>'}).join("")+'</div>'+
  '<div class="tot"><button type="button" id="pgCopy">Copier les adresses</button><button type="button" id="pgCopy2" class="alt">Titres + adresses</button></div>'+
  '<p class="count" id="pgCount" style="margin:0 4px 10px"></p><div id="pgList"></div>';
 $("pgQ").value=PG_Q;
 $("pgQ").oninput=function(){PG_Q=this.value;renderPagesListe()};
 $("pgFlt").onclick=function(e){var b=e.target.closest("button");if(!b)return;PG_FILTRE=b.dataset.k;
  document.querySelectorAll("#pgFlt button").forEach(function(x){x.classList.toggle("on",x===b)});renderPagesListe()};
 $("pgCopy").onclick=function(){var L=pgFiltrees();copier(L.map(function(x){return x.u}).join("\n"),L.length+" adresse"+(L.length>1?"s":"")+" copiée"+(L.length>1?"s":"")+" ✓")};
 $("pgCopy2").onclick=function(){var L=pgFiltrees();copier(L.map(function(x){return x.t+" — "+x.u}).join("\n"),L.length+" ligne"+(L.length>1?"s":"")+" copiée"+(L.length>1?"s":"")+" ✓")};
 $("pgList").onclick=function(e){var b=e.target.closest("button");if(!b||b.dataset.a!=="copy")return;var L=pgFiltrees(),x=L[parseInt(b.closest(".cd").dataset.i,10)];if(x)copier(x.u,"Adresse copiée ✓")};
 renderPagesListe()}
var ONG={codes:["tCodes","Codes d’activation"],vue:["tVue","Vue d’ensemble"],sante:["tSante","Doublons et santé"],pages:["tPages","Pages publiées"]},vu={};
function onglet(t){
 Object.keys(ONG).forEach(function(k){$(ONG[k][0]).hidden=k!==t});
 document.querySelectorAll("#tabs button").forEach(function(x){x.classList.toggle("on",x.dataset.t===t)});
 $("ttl").textContent=ONG[t][1];
 if(t==="vue")renderVue();else if(t==="sante"&&!vu.sante){renderSante();vu.sante=1}else if(t==="pages")renderPages()}
$("tabs").onclick=function(e){var b=e.target.closest("button");if(b)onglet(b.dataset.t)};
$("bell").onclick=function(){toast("Aucune nouvelle notification")};
function refuser(m){$("vNo").hidden=false;$("vAd").hidden=true;$("noTtl").textContent="Accès réservé";if(m)$("noMsg").textContent=m}
function verifierAcces(){
 $("vNo").hidden=false;$("vAd").hidden=true;$("noTtl").textContent="Vérification…";$("noMsg").textContent="Vérification de votre accès administrateur…";$("retry").hidden=true;
 if(!window.syncOn||!syncOn()){refuser("Connectez-vous avec votre compte administrateur.");return}
 var delai=new Promise(function(_,no){setTimeout(function(){no(new Error("delai"))},15000)});
 Promise.race([sbRpc("admin_lister_codes",{p_statut:null,p_limite:1}),delai]).then(function(){
  $("vNo").hidden=true;$("vAd").hidden=false;charger()
 }).catch(function(e){
  var c=String(e&&e.message||e);
  refuser(c==="delai"?"Le serveur ne répond pas (connexion lente ?). Réessayez.":
   c==="connexion"?"Connectez-vous avec votre compte administrateur.":
   (c==="http401"||c==="http403")?"Ce compte n’est pas administrateur, ou la session a expiré : reconnectez-vous.":
   c==="http404"?"La fonction admin_lister_codes est introuvable côté Supabase (voir supabase/LISEZMOI.md §8).":
   "Impossible de vérifier l’accès ("+c+"). Réessayez.");
  if(c!=="connexion")$("retry").hidden=false})}
$("retry").onclick=verifierAcces;
verifierAcces();
$("nav").onclick=navClick;
nav();
</script>
</body>
