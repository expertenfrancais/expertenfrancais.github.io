@media(min-width:500px) and (min-height:640px) and (hover:hover) and (pointer:fine){.nav{position:sticky;left:auto;right:auto;width:auto;max-width:none;margin:auto 0 0}main{padding-bottom:30px!important}}

<div class="app">

    <div class="who"><div class="av" id="av">E</div><div style="min-width:0"><small>Votre évolution</small><b>Ma progression</b></div></div>

      <div class="st"><b id="sE">–</b><span>Exercices réussis</span></div>
    </section>

    <section class="card" id="cMat">
      <h3>Par matière</h3>
      <div id="mats"></div>

<script>
$("set").innerHTML=ico("gear");
var nm=userName();if(nm)$("av").textContent=nm.charAt(0).toUpperCase();

var COL=["#8c6fe0","#2fa883","#5f84e6","#e5578a","#e59a3a","#3aa7c9"];
function plural(n,a,b){return n>1?b:a}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}

/* Séries de jours : la série reste en vie tant qu’on a travaillé aujourd’hui ou hier. */
function streaks(act){
 var today=new Date(),cur=0,d=today;
 if(!act[dayKey(d)])d=addDays(d,-1);
 while(act[dayKey(d)]){cur++;d=addDays(d,-1)}
 var ks=Object.keys(act).filter(function(k){return act[k]>0}).sort(),best=0,run=0,prev=null;
 ks.forEach(function(k){var t=Date.parse(k+"T12:00:00");run=(prev!==null&&Math.round((t-prev)/864e5)===1)?run+1:1;if(run>best)best=run;prev=t});
 return{cur:cur,best:best,days:ks.length,todayOn:!!act[dayKey(today)]}}

function paintStreak(act){
 var s=streaks(act);
 $("stk").textContent=s.cur+" "+plural(s.cur,"jour","jours");
 $("stkT").textContent=s.cur?(s.todayOn?"de suite : bravo, continuez demain !":"de suite : travaillez aujourd’hui pour la garder"):"Commencez une série aujourd’hui";
 $("stkB").textContent=s.days?"Meilleure série : "+s.best+" "+plural(s.best,"jour","jours")+" · "+s.days+" "+plural(s.days,"jour actif","jours actifs")+" au total":"Ouvrez une partie de cours ou faites un quiz pour démarrer.";
}

function paintWeek(act){
 var max=1,i,days=[];
 for(i=6;i>=0;i--){var d=addDays(new Date(),-i),n=act[dayKey(d)]||0;if(n>max)max=n;days.push({d:d,n:n,t:i===0})}
 $("week").innerHTML=days.map(function(x){
  var h=x.n?Math.max(14,Math.round(70*x.n/max)):6,l=x.d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".","").slice(0,3);
  return '<div class="wd'+(x.n?" on":"")+(x.t?" today":"")+'" title="'+x.n+' action'+(x.n>1?"s":"")+'"><i style="height:'+h+'px"></i><span>'+esc(l)+'</span></div>'}).join("")}

function paint(){
 var act=ls("activity",{}),scores=ls("scores",{}),CO=DOCS.filter(function(d){return d.k==="Cours"&&d.s&&d.s.length&&canAccess(d.id)});
 paintStreak(act);paintWeek(act);

 var tp=0,dp=0,qa=0,qo=0,ea=0,eo=0,weak=[],mats={},partial=[],fresh=[];
 CO.forEach(function(d){
  var total=d.s.length,done=partsDone(d.id).filter(function(i){return i<total}).length,m=d.m||"Autres",M=mats[m]||(mats[m]={m:m,tp:0,dp:0,qa:0,qo:0,ea:0,eo:0,c:0,cd:0});
  dp+=done;if(done>0){tp+=total;M.tp+=total;M.dp+=done;M.c++;if(done>=total)M.cd++}
  var c=scores[d.id];
  if(c)Object.keys(c).forEach(function(k){var s=scoreSum(c[k]);
   qa+=s.qa;qo+=s.qo;ea+=s.ea;eo+=s.eo;M.qa+=s.qa;M.qo+=s.qo;M.ea+=s.ea;M.eo+=s.eo;
   var rq=s.qa?s.qo/s.qa:1,re=s.ea?s.eo/s.ea:1;
   if((s.qa&&rq<.6)||(s.ea&&re<.5))weak.push({d:d,i:+k,r:Math.min(rq,re)})});
  if(done>0&&done<total)partial.push({d:d,done:done,total:total});
  if(done===0)fresh.push(d)});

 $("sP").textContent=dp;
 $("sQ").textContent=qa?Math.round(100*qo/qa)+" %":"–";
 $("sE").textContent=ea?Math.round(100*eo/ea)+" %":"–";

 var keys=Object.keys(mats).filter(function(k){return mats[k].dp>0}).sort(function(a,b){return mats[b].dp-mats[a].dp});
 $("mats").innerHTML=keys.length?keys.map(function(k,i){var M=mats[k],p=Math.round(100*M.dp/M.tp),a=M.qa+M.ea,r=a?Math.round(100*(M.qo+M.eo)/a):null;
  return '<div class="mat"><div class="l"><b>'+esc(M.m)+'</b><em>'+p+' %</em></div><div class="bar2" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+p+'%;--c:'+COL[i%COL.length]+'"></i></div>'+
   '<small>'+M.dp+" / "+M.tp+" parties de "+M.c+" cours commencé"+(M.c>1?"s":"")+" · "+M.cd+" terminé"+(M.cd>1?"s":"")+(r!==null?" · réussite "+r+" %":"")+'</small></div>'}).join(""):
  '<p class="nodata">Ouvrez un cours : votre avancement par matière (grammaire, conjugaison, orthographe…) s’affichera ici.</p>';

 weak.sort(function(a,b){return a.r-b.r});
 $("weak").innerHTML=weak.length?weak.slice(0,5).map(function(w){var sec=docInfo(w.d).sections[w.i],t=sec?sec.t:"Partie "+(w.i+1);
  return '<a class="row" href="'+partUrl(w.d,w.i)+'"><div><b>Partie '+(w.i+1)+" · "+esc(t)+'</b><small>'+esc(w.d.t)+" · "+esc(w.d.n)+'</small></div><em class="bad">'+Math.round(100*w.r)+' %</em></a>'}).join(""):
  '<p class="nodata">'+((qa||ea)?"Aucun point faible : continuez comme ça ! 🎉":"Faites les quiz et les exercices : les parties où vous avez le plus d’erreurs apparaîtront ici.")+'</p>';

 partial.sort(function(a,b){return b.done/b.total-a.done/a.total});
 var nx=partial.slice(0,3).map(function(x){return '<a class="row" href="'+partUrl(x.d,Math.min(x.done,x.total-1))+'"><div><b>'+esc(x.d.t)+'</b><small>'+esc(x.d.m)+" · "+esc(x.d.n)+" · "+x.done+" / "+x.total+' parties</small></div><em>Reprendre ›</em></a>'});
 var lv=(typeof userProfile==="function"&&userProfile().grade)||"";
 var hc=(typeof homeCycle==="function"&&homeCycle())||"",sug=fresh.filter(function(d){return lv?d.n===lv:(!hc||cycleOf(d.n)===hc)}).slice(0,Math.max(0,4-nx.length));
 if(!sug.length&&nx.length<4)sug=fresh.slice(0,4-nx.length);
 nx=nx.concat(sug.map(function(d){return '<a class="row" href="'+partUrl(d,0)+'"><div><b>'+esc(d.t)+'</b><small>'+esc(d.m)+" · "+esc(d.n)+' · nouveau</small></div><em>Commencer ›</em></a>'}));
 $("next").innerHTML=nx.length?nx.join(""):'<p class="nodata">Vous avez terminé tous les cours disponibles. Bravo ! 🏆</p>';
 drawNav(4)}

$("set").onclick=function(){location.href="parametres.html"};
$("nav").onclick=navClick;
paint();
</script>
