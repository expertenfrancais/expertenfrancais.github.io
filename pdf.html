<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1ecfb">
<meta name="robots" content="noindex">
<title>Cours en PDF | Expert en français</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="fiche.css">
<style>
/* ===== pdf.html : document d'un cours entier, prêt à être enregistré en PDF =====
   Adresse : pdf.html?id=<numéro du cours> (fiche pédagogique : pdf.html?n=<numéro de fiche>&p=prof|apprenant). Réservé à ceux qui ont acheté le cours ou qui sont abonnés.
   Le bouton appelle l'impression du téléphone : choisir « Enregistrer en PDF ». Toujours en thème clair. */
body.pdfpage{display:block;min-height:100vh;background:var(--page);color:var(--ink)}
.pdfpage .wrap{max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 40px}
.ptool{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.pback{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:21px;background:var(--card);color:var(--link);font-size:13.5px;font-weight:600;text-decoration:none;box-shadow:0 6px 16px rgba(90,60,170,.12)}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border:0;border-radius:21px;background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff;font-size:13.5px;font-weight:700;text-decoration:none}
.pbtn[disabled]{opacity:.55;cursor:default}
.phint{margin:0 2px 14px;font-size:12.5px;line-height:1.6;color:var(--sub)}
.sheet{background:#fff;color:var(--ink);border-radius:22px;padding:22px 18px 26px;box-shadow:0 10px 30px rgba(90,60,170,.12)}
.phead{margin:0 0 18px;padding:0 0 14px;border-bottom:2px solid var(--p2)}
.phead small{display:block;margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--link)}
.phead h1{margin:0 0 6px;font-size:24px;line-height:1.25;color:var(--ink)}
.phead p{margin:0;font-size:12.5px;color:var(--sub)}
.ps{margin:0 0 10px}
.pst{display:flex;align-items:center;gap:12px;margin:26px 0 14px;font-size:18.5px;line-height:1.3;color:var(--ink)}
.pst i{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--p2);color:#fff;font-style:normal;font-size:14px;font-weight:700}
.pch{margin:20px 0 10px;font-size:14.5px;color:var(--link)}
.pci{margin:0 0 6px;padding:8px 12px;border-radius:12px;background:var(--b-ret)}
.pci p{margin:0 0 4px!important;font-size:13.5px!important;line-height:1.6!important}
.pdfpage .bl-opt{pointer-events:none}
.pdfpage .bl-show,.pdfpage .bl-corr,.pdfpage .bl-expl{display:none!important}
.pmsg{max-width:430px;margin:12vh auto 0;padding:26px 20px;border-radius:24px;background:var(--card);text-align:center;box-shadow:0 10px 30px rgba(90,60,170,.12)}
.pmsg h1{margin:0 0 10px;font-size:20px;color:var(--ink)}
.pmsg p{margin:0 0 18px;font-size:14px;line-height:1.6;color:var(--sub)}
.wait{padding:30px 0;text-align:center;color:var(--sub);font-size:14px}

/* Fiches pédagogiques : A4 paysage (règle ajoutée par le script, voir showFiche) */
.f-mode .wrap{max-width:1180px}
.ptool{flex-wrap:wrap}
.ptabs{display:flex;flex:1 1 100%;order:3;gap:6px;justify-content:center;flex-wrap:wrap}
.ptabs .pt{display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1.25;min-height:38px;padding:6px 14px;border-radius:19px;background:var(--card);color:var(--link);font-size:12.5px;font-weight:600;text-decoration:none}
.ptabs .pt.on{background:var(--p2);color:#fff}
@page{size:A4;margin:16mm 14mm 20mm}
@page{@bottom-right{content:counter(page) " / " counter(pages);font-size:9pt;color:#6b6490}}
@media print{
 html,body,body.pdfpage{background:#fff!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ptool,.phint,.toast{display:none!important}
 .pdfpage .wrap{max-width:none;padding:0}
 .sheet{padding:0;border-radius:0;box-shadow:none}
 .phead h1{font-size:22pt}
 .pst{font-size:15pt;break-after:avoid;page-break-after:avoid}
 .pch{break-after:avoid;page-break-after:avoid}
 .lbody p{font-size:11pt;line-height:1.6;margin:0 0 8px}
 .lbody .bl-list,.bl-tab table{font-size:10.5pt}
 .bl p{font-size:10.5pt;line-height:1.55}
 .pci p{font-size:10.5pt!important}
 .bl,.pci,.bl-cell{break-inside:avoid;page-break-inside:avoid}
 .bl-tab{break-inside:auto;page-break-inside:auto}
 .bl-tab tr{break-inside:avoid;page-break-inside:avoid}
 .bl-h{break-after:avoid;page-break-after:avoid}
 .pcorr{break-before:page;page-break-before:always}
}
</style>
</head>
<body class="pdfpage">
<div class="wrap" id="wrap">
  <div class="ptool">
    <a class="pback" id="pback" href="catalogue.html">‹ Retour</a>
    <div class="ptabs" id="ptabs" hidden></div>
    <button class="pbtn" id="pp" type="button" disabled>Enregistrer en PDF</button>
  </div>
  <p class="phint" id="phint">Dans la fenêtre qui s’ouvre, choisissez « Enregistrer au format PDF » (ou « Enregistrer en PDF ») à la place de l’imprimante.</p>
  <div id="page"><div class="wait">Préparation du document…</div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>var PUBLIC_PAGE=true;document.documentElement.setAttribute("data-theme","light")</script>
<script src="data.js"></script>
<script src="blocs.js"></script>
<script src="fiche.js"></script>
<script>
(function(){
document.documentElement.setAttribute("data-theme","light");
var q=new URLSearchParams(location.search),id=+q.get("id"),nf=+q.get("n"),
 d=ALLDOCS.filter(function(x){return nf?(x.k==="Fiches"&&x.fn===nf):x.id===id})[0],P=$("page"),pp=$("pp");
function msg(t,p,label,href){
 P.innerHTML='<div class="pmsg"><h1>'+t+'</h1><p>'+p+'</p><a class="pbtn" href="'+href+'">'+label+'</a></div>';
 pp.hidden=true;$("phint").hidden=true;$("pback").hidden=true}
if(!d)return msg("Cours introuvable","Ce cours n’existe pas ou n’est plus disponible.","Voir le catalogue","catalogue.html");
if(d.k==="Fiches"&&!ficheAcces(d.id))return msg("PDF réservé aux abonnés","Le PDF de la fiche contient toutes les étapes, la page de l’apprenant et le corrigé : il est réservé aux abonnés.","S’abonner",BASE+"abonnement.html");
if(d.k!=="Fiches"&&!canAccess(d.id))return msg("Téléchargement réservé","Le PDF est réservé aux abonnés et à ceux qui ont acheté ce cours.","Retour au cours",docUrl(d));
if(d.k==="Fiches"&&ALLOWED_TYPES.indexOf("Fiches")<0)return msg("Réservé aux enseignants","Les fiches pédagogiques sont réservées au profil enseignant.","Voir le catalogue","catalogue.html");
document.title=d.t+" | PDF | Expert en français";

/* Retour : revient à la page du cours si l’on en vient, sinon l’ouvre */
$("pback").href=docUrl(d);
$("pback").onclick=function(e){
 /* Si l’on vient d’une page du site : vrai retour en arrière (jamais un nouvel aller vers la page de départ, sinon on tourne en rond). Sinon : on remplace cet écran par la fiche ou le cours. */
 var ok=false;try{ok=window.history.length>1&&document.referrer&&new URL(document.referrer).origin===location.origin}catch(x){}
 e.preventDefault();
 if(ok)history.back();else location.replace(d.k==="Fiches"?BASE+"fiche.html?n="+d.fn:docUrl(d))};

/* Fiche pédagogique : deux sorties, A4 paysage. p=prof : la fiche du professeur ; p=apprenant : page de l’apprenant, puis corrigé sur une feuille séparée.
   Date et effectif arrivent dans l’adresse (g, f, t, d) depuis fiche.html ; rien n’est enregistré. */
function showFiche(j){
 if(!j||j.type!=="fiche")return msg("Fiche indisponible","Le contenu de cette fiche n’a pas pu être chargé.","Retour à la fiche",docUrl(d));
 var p=q.get("p")==="apprenant"?"apprenant":"prof",
  v={g:q.get("g")||"",f:q.get("f")||"",t:q.get("t")||"",date:q.get("d")||""};
 document.body.className="pdfpage f-mode";
 var pg=document.createElement("style");pg.textContent="@page{size:A4 landscape;margin:10mm 10mm 14mm}";document.head.appendChild(pg);
 var base="pdf.html?n="+d.fn+"&g="+encodeURIComponent(v.g)+"&f="+encodeURIComponent(v.f)+"&t="+encodeURIComponent(v.t)+"&d="+encodeURIComponent(v.date),tb=$("ptabs");
 tb.hidden=false;
 tb.innerHTML='<a class="pt'+(p==="prof"?" on":"")+'" href="'+base+'&p=prof">Fiche du professeur</a><a class="pt'+(p==="apprenant"?" on":"")+'" href="'+base+'&p=apprenant">Page de l’apprenant + corrigé</a>';
 var pts=tb.querySelectorAll("a.pt");
 for(var z=0;z<pts.length;z++)pts[z].onclick=function(e){e.preventDefault();location.replace(this.getAttribute("href"))}; /* changer d’onglet ne crée pas d’entrée d’historique */
 P.innerHTML='<article class="sheet fx f-force">'+(p==="prof"?FICHE.prof(j,v,"print"):FICHE.apprenant(j,v)+'<div class="f-pagebreak"></div>'+FICHE.corrige(j))+'</article>';
 var ft=("Expert en français · "+d.t+(userName()?" · "+userName():"")).replace(/[\\"]/g,"").replace(/[\r\n]+/g," "),st=document.createElement("style");
 st.textContent='@page{@bottom-left{content:"'+ft+'";font-size:8.5pt;color:#6b6490}}';document.head.appendChild(st);
 pp.disabled=false;
 pp.onclick=function(){
  if(typeof window.print!=="function")return toast("L’impression n’est pas disponible sur cet appareil");
  try{window.print()}catch(e){toast("L’impression n’est pas disponible sur cet appareil")}}}

function show(j){
 if(d.k==="Fiches")return showFiche(j);
 var S=docInfo(d).sections;
 if(j&&Array.isArray(j.sections)&&j.sections.length)S=j.sections;
 var nq=0,ne=0,corr=[],h="",i,k;
 for(i=0;i<S.length;i++){
  var sec=S[i],bl=sec.blocs||[],cs=[];
  h+='<section class="ps"><h2 class="pst"><i>'+(i+1)+'</i><span>'+esc(sec.t)+'</span></h2><div class="lbody">';
  if(!bl.length&&sec.c)h+=BLOCS.render([{type:"p",text:sec.c}]);
  for(k=0;k<bl.length;k++){
   var b=bl[k],r=BLOCS.render([b]);
   if(b.type==="quiz"){
    nq++;r=r.replace(">Quiz<",">Quiz "+nq+"<");
    var a=+b.answer||0,opt=(b.options&&b.options[a])||"";
    cs.push("**Quiz "+nq+" : "+"ABCDEFGH".charAt(a)+".** "+opt+(b.explain?"\n"+b.explain:""))}
   else if(b.type==="exercise"){
    ne++;r=r.replace(">Exercice<",">Exercice "+ne+"<");
    var c=Array.isArray(b.corrige)?b.corrige.join("\n"):b.corrige;
    if(c)cs.push("**Exercice "+ne+"**\n"+c)}
   h+=r}
  h+='</div></section>';
  if(cs.length)corr.push({t:sec.t,n:i+1,items:cs})}
 /* Corrigés regroupés à la fin du document */
 if(corr.length){
  h+='<section class="ps pcorr"><h2 class="pst"><i>✓</i><span>Corrigés</span></h2><div class="lbody">';
  corr.forEach(function(c){
   h+='<h3 class="pch">Partie '+c.n+' · '+esc(c.t)+'</h3>';
   c.items.forEach(function(t){h+='<div class="pci">'+BLOCS.render([{type:"p",text:t}])+'</div>'})});
  h+='</div></section>'}
 var name=userName(),
  today=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
 P.innerHTML='<article class="sheet"><header class="phead"><small>'+esc(d.k)+' · '+esc(d.n)+' · '+esc(d.m)+'</small><h1>'+esc(d.t)+'</h1><p>'+
  (name?'Document personnel de '+esc(name)+' · ':'')+today+'</p></header>'+h+'</article>';
 /* Pied de page imprimé (marge basse) : site, cours, nom. Ignoré si le navigateur ne gère pas les marges de page. */
 var ft=("Expert en français · "+d.t+(name?" · "+name:"")).replace(/[\\"]/g,"").replace(/[\r\n]+/g," "),
  st=document.createElement("style");
 st.textContent='@page{@bottom-left{content:"'+ft+'";font-size:8.5pt;color:#6b6490}}';
 document.head.appendChild(st);
 pp.disabled=false;
 pp.onclick=function(){
  if(typeof window.print!=="function")return toast("L’impression n’est pas disponible sur cet appareil");
  try{window.print()}catch(e){toast("L’impression n’est pas disponible sur cet appareil")}}}

if(!window.fetch)return show(null);
fetch(BASE+contentFile(d)).then(function(r){return r.ok?r.json():null}).catch(function(){return null}).then(show);
})();
</script>
</body>
</html>
