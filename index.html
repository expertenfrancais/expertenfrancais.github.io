:root[data-theme="dark"]{--ink:#efe9ff;--sub:#b3aad3;--field:#2c2450;--link:#c2b0ff;--card:#221b40;--page:#17122c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}

.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px}

 background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.25) 45%,rgba(255,255,255,.65));
 box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95),inset 0 -3px 6px rgba(var(--c),.35),0 12px 16px -6px rgba(var(--c),.65),0 2px 4px rgba(40,30,80,.12);
 outline:3px solid transparent;outline-offset:3px;transition:outline-color .2s}

.gi:after{background:linear-gradient(125deg,rgba(255,255,255,.75) 0,rgba(255,255,255,.12) 38%,transparent 55%)}
.gi.clear{--pane:linear-gradient(160deg,rgba(255,255,255,.7),rgba(222,230,246,.4))}

.hit i{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--p2);color:#fff;font-style:normal;font-size:12.5px;font-weight:700}

.nav{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:430px;height:calc(66px + env(safe-area-inset-bottom,0px));z-index:10;display:grid;grid-template-columns:repeat(5,1fr);--cx:10%}

.bd{position:absolute;top:10px;right:calc(50% - 24px);min-width:18px;height:18px;border-radius:9px;background:#e5578a;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
@media(min-width:500px) and (min-height:640px) and (hover:hover) and (pointer:fine){.nav{position:sticky;left:auto;right:auto;width:auto;max-width:none;margin:auto 0 0}main{padding-bottom:30px!important}}

body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset=".3" stop-color="#ffc371"/><stop offset=".55" stop-color="#3ddc97"/><stop offset=".8" stop-color="#3a8dff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient></defs></svg>
<div class="app">

    <div class="who"><div class="av" id="av" role="link" tabindex="0" aria-label="Mon profil">E</div><div style="min-width:0"><small>Bonjour,</small><b id="nm">Enseignant</b></div></div>

      <label class="field"><svg id="i-search" width="22" height="22" viewBox="0 0 24 24"></svg><input id="q" type="search" placeholder="Rechercher un document…" autocomplete="off"></label>
      <button class="flt" id="flt" type="button" aria-label="Filtrer et trier" aria-expanded="false"><svg id="i-flt" width="24" height="24" viewBox="0 0 24 24"></svg></button>

<script>
/* ===== Réglages ===== */
/* Catégories : v = "clear" (verre transparent) ou "tint" (verre coloré) ; rgb = couleur de l’ombre ; gl = couleur du pictogramme ;
   t1/t2 = dégradé du verre coloré ; g = dégradé de secours des documents.
   Optionnel : img:"lien.png" pour utiliser votre propre icône 3D (PNG transparent) à la place du verre CSS. */
var TYPES=[
 {k:"Cours",ic:"book",v:"clear",rgb:"90,120,255",gl:"url(#rb)",g:["#8c6fe0","#b29af4"]},
 {k:"Fiches",ic:"note",v:"tint",rgb:"240,120,50",t1:"#f7a257",t2:"#e8602b",gl:"#fff",g:["#5f84e6","#9bb4f5"]},
 {k:"Exercices",ic:"pen",v:"tint",rgb:"100,85,230",t1:"#8d7ff5",t2:"#4a3dc2",gl:"#fff",g:["#2fa883","#7fd6b8"]},
 {k:"Évaluations",ic:"eval",v:"tint",rgb:"30,160,95",t1:"#4cc98a",t2:"#13894c",gl:"#fff",g:["#e8825f","#f2b08a"]},
 {k:"Annales",ic:"eval",v:"tint",rgb:"60,150,190",t1:"#6cc0e0",t2:"#2f8db5",gl:"#fff",g:["#4aa3c8","#8fd0e8"]},
 {k:"Programmes",ic:"plan",v:"clear",rgb:"60,60,95",gl:"#17171f",g:["#cf63b4","#e79ad6"]}
];
TYPES=TYPES.filter(function(x){return ALLOWED_TYPES.indexOf(x.k)>-1});
function tp(k){return TYPES.filter(function(x){return x.k===k})[0]}

var type=null,niv=myNiv(),cyc=myCyc(),q="",mats=[],sort="pert",PAGE=8,shown=PAGE;
function rs(){shown=PAGE;render()}
/* Sous-disciplines : la liste se construit toute seule à partir des cours (champ m de data.js), dans cet ordre */
var ORDER=["Grammaire","Orthographe","Conjugaison","Vocabulaire","Lecture","Expression écrite","Littérature","Linguistique","Tous domaines"];
function rank(m){var i=ORDER.indexOf(m);return i<0?99:i}
function matLabel(m){return m==="Tous domaines"?"Multi-domaines":m}
function cmp(a,b){return a<b?-1:a>b?1:0}
var MATS=DOCS.map(function(d){return d.m}).filter(function(m,i,a){return a.indexOf(m)===i}).sort(function(a,b){return rank(a)-rank(b)||cmp(a,b)});
var SORTS=[["pert","Pertinence"],["mat","Par sous-discipline"],["asc","Prix croissant"],["desc","Prix décroissant"],["note","Mieux notés"],["az","Titre A–Z"]];
function fits(d,skipMat,noQ){var qq=norm(q.trim());
 return (!type||d.k===type)&&(cyc==="Tous"||d.c===cyc)&&(niv==="Tous"||d.n===niv)&&(skipMat||!mats.length||mats.indexOf(d.m)>-1)&&(noQ||!qq||norm(d.t+" "+d.m+" "+d.k).indexOf(qq)>-1)}
/* Choix multiple ; le nombre affiché tient compte des autres filtres */
function drawMats(){
 var h='<button class="chip'+(mats.length?"":" on")+'" data-v="">Toutes</button>';
 MATS.forEach(function(m){var n=DOCS.filter(function(d){return d.m===m&&fits(d,true)}).length,on=mats.indexOf(m)>-1;
  h+='<button class="chip'+(on?" on":"")+(n||on?"":" zero")+'" data-v="'+esc(m)+'" aria-pressed="'+on+'">'+esc(matLabel(m))+' <small>'+n+'</small></button>'});
 $("mats").innerHTML=h}
function drawSorts(){$("sorts").innerHTML=SORTS.map(function(x){return '<button class="chip'+(sort===x[0]?" on":"")+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join("")}

/* En-tête */
["gear","search","flt"].forEach(function(n){$("i-"+n).innerHTML='<path d="'+IC[n]+'"/>'});
var name="";try{name=localStorage.getItem("user_name")||""}catch(e){}
if(name){$("nm").textContent=name;$("av").textContent=name.charAt(0).toUpperCase()}

/* Catégories et niveaux */
$("cats").innerHTML=TYPES.map(function(x){
 var t=x.img?'<img class="gimg" src="'+x.img+'" alt="">':
  '<span class="gi '+x.v+'" style="--c:'+x.rgb+';--t1:'+(x.t1||"")+';--t2:'+(x.t2||"")+';--gl:'+x.gl+'">'+ico(x.ic)+'</span>';
 return '<button class="cat" data-k="'+x.k+'">'+t+x.k+'</button>'}).join("");
function drawLevels(){$("levels").innerHTML=levelChips(cyc,niv)}drawLevels();

/* Liste */
function render(){
 var res=DOCS.filter(function(d){return fits(d,false)});
 if(sort==="asc")res.sort(function(a,b){return a.pr-b.pr});
 else if(sort==="desc")res.sort(function(a,b){return b.pr-a.pr});
 else if(sort==="note")res.sort(function(a,b){return b.r-a.r});
 else if(sort==="az")res.sort(function(a,b){return cmp(norm(a.t),norm(b.t))});
 else if(sort==="mat")res.sort(function(a,b){return rank(a.m)-rank(b.m)||cmp(a.m,b.m)||cmp(norm(a.t),norm(b.t))});
 $("cnt").textContent=res.length+" résultat"+(res.length>1?"s":"");
 function docCard(d){
  var T=tp(d.k),f=favs.indexOf(d.id)>-1,c=cart.indexOf(d.id)>-1;
  return '<article class="'+docClass(d)+'">'+ficheBand(d)+'<div class="cov" style="--g1:'+T.g[0]+';--g2:'+T.g[1]+'"><img src="'+esc(d.img)+'" alt="" loading="lazy" decoding="async" onerror="this.remove()">'+
   '<span class="tag">'+((({Cours:"Cours"})[d.k]||d.k.replace(/s$/,"")))+'</span><span class="subj">'+esc(d.m)+'</span>'+
   '<button class="fav" data-f="'+d.id+'" aria-pressed="'+f+'" aria-label="Favori">'+ico("heart")+'</button></div>'+
   '<div class="body"><h3>'+esc(d.t)+'</h3><p class="meta">Niveau '+esc(d.n)+'</p><a href="'+docUrl(d)+'" style="font-size:12px;font-weight:600;color:#7a5cd0;text-decoration:none">Voir les détails ›</a>'+
   '<div class="r2"><div class="price"><small>Prix</small><b>'+(canAccess(d.id)?(GRATUIT?"Gratuit":isSubscribed()?"Inclus":"Acheté"):(ACHAT?price(d.pr):"Abonnés"))+'</b></div>'+
   '<span class="rate">'+ico("star")+d.r.toFixed(1)+'</span>'+
   (canAccess(d.id)||!ACHAT?'<button class="add in" data-o="'+d.id+'">'+(canAccess(d.id)?"Ouvrir":"Voir")+'</button>':'<button class="add'+(c?" in":"")+'" data-c="'+d.id+'">'+(c?"Ajouté ✓":"Ajouter")+'</button>')+'</div></div></article>'}
 /* Rangement par catégorie : plusieurs groupes = une rangée par groupe ; un seul groupe = liste avec « Afficher plus » */
 var L=$("list");
 if(!res.length){L.className="list";L.innerHTML='<p class="empty">Aucun document ne correspond à votre recherche.</p>';$("pgmore").hidden=true}
 else if(shelfGroups(res)>1){L.className="shelves";L.innerHTML=shelvesHTML(res,docCard,8);$("pgmore").hidden=true}
 else{L.className="list";L.innerHTML=res.slice(0,shown).map(docCard).join("");$("pgmore").hidden=res.length<=shown}
 document.querySelectorAll(".cat").forEach(function(b){b.classList.toggle("on",b.dataset.k===type)});
 drawLevels();drawMats();drawSorts();paintHits(res.length)}
/* Recherche dans le texte des cours : à partir de 3 lettres */
function paintHits(n){var box=$("chits"),raw=q.trim(),qn=norm(raw);
 if(qn.length<3){box.innerHTML="";return}
 if(!CIDX)box.innerHTML='<p class="hitmore">Recherche dans le contenu des cours…</p>';
 contentReady(function(){
  if(norm(q.trim())!==qn)return;
  var hits=contentHits(raw,DOCS.filter(function(d){return fits(d,false,true)}));
  box.innerHTML=hitsHTML(hits,12);
  if(!n&&hits.length)$("list").innerHTML=""})}

function nav(){drawNav(0)}
function seeGroup(e,apply){var g=e.target.closest(".shelf-go");if(!g)return;apply(g.dataset.k,g.dataset.m);
 var t=$("list").previousElementSibling||$("list");if(t.scrollIntoView)t.scrollIntoView({behavior:"smooth",block:"start"})}

/* Événements */
$("q").oninput=function(){q=this.value;rs()};
$("flt").onclick=function(){var h=$("fpanel").hidden;$("fpanel").hidden=!h;this.setAttribute("aria-expanded",h)};
$("mats").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;var v=b.dataset.v;
 if(!v)mats=[];else{var i=mats.indexOf(v);if(i>-1)mats.splice(i,1);else mats.push(v)}rs()};
$("sorts").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;sort=b.dataset.v;rs()};
$("all").onclick=function(){type=null;mats=[];sort="pert";niv="Tous";cyc=canSwitchCycle()?"Tous":activeCycle();q="";$("q").value="";rs()};
$("set").onclick=function(){location.href="parametres.html"};
$("av").onclick=function(){location.href="profil.html"};
$("av").onkeydown=function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();location.href="profil.html"}};
$("cats").onclick=function(e){var b=e.target.closest(".cat");if(!b)return;type=type===b.dataset.k?null:b.dataset.k;rs()};
$("levels").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;if(b.dataset.cy){cyc=b.dataset.cy;niv="Tous";if(cyc!=="Tous")setViewCycle(cyc)}else niv=b.dataset.n;rs()};
$("list").onclick=function(e){
 var f=e.target.closest(".fav"),c=e.target.closest(".add");
 if(f){var id=+f.dataset.f,i=favs.indexOf(id);i>-1?favs.splice(i,1):favs.push(id);sv("favs",favs);f.setAttribute("aria-pressed",i<0);toast(i<0?"Ajouté aux favoris":"Retiré des favoris")}
 if(c&&c.dataset.o)return openDoc(+c.dataset.o);
 if(c){var id2=+c.dataset.c,j=cart.indexOf(id2);j>-1?cart.splice(j,1):cart.push(id2);sv("cart",cart);
  c.classList.toggle("in",j<0);c.textContent=j<0?"Ajouté ✓":"Ajouter";nav();toast(j<0?"Ajouté au panier":"Retiré du panier")}};
$("pgmore").onclick=function(){shown+=PAGE;render()};
$("list").addEventListener("click",function(e){seeGroup(e,function(k,m){if(k)type=k;mats=[m];rs()})});
$("nav").onclick=navClick;
nav();render();cycleBar("list");subBanner("list");
</script>
