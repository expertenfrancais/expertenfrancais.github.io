<title>Abonnement | Expert en français</title>
<style>
/* Transitions entre pages (navigateurs récents) et fondu d'arrivée du contenu */
@view-transition{navigation:auto}
::view-transition-old(root){animation:.16s ease both vt-out}
::view-transition-new(root){animation:.2s ease both vt-in}
.nav{view-transition-name:nav}
::view-transition-group(nav){animation-duration:.2s}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0}}
@keyframes arrive{from{opacity:0;transform:translateY(6px)}}
.fresh main>*,.fresh .list>*,.fresh .cats>*{animation:arrive .32s ease both}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}.fresh main>*,.fresh .list>*,.fresh .cats>*{animation:none}}

:root{--p1:#b29af4;--p2:#8c6fe0;--ink:#2e2160;--sub:#6b6490;--field:#f4eefb;--link:#5d49b8;--card:#fff;--page:#f1ecfb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#efe9ff;--sub:#b3aad3;--field:#2c2450;--link:#c2b0ff;--card:#221b40;--page:#17122c}}
:root[data-theme="dark"]{--ink:#efe9ff;--sub:#b3aad3;--field:#2c2450;--link:#c2b0ff;--card:#221b40;--page:#17122c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%;background:#8d7bc4;font-family:"Poppins","Segoe UI",system-ui,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100svh}
button{font:inherit;cursor:pointer}
svg{fill:currentColor}
.app{position:relative;width:100%;max-width:430px;min-height:100vh;min-height:100svh;background:var(--page);display:flex;flex-direction:column;overflow-x:clip}
@media(min-width:500px) and (min-height:640px) and (hover:hover) and (pointer:fine){body{align-items:center}.app{min-height:0;height:min(880px,96vh);overflow-y:auto;scrollbar-width:none;border-radius:46px;box-shadow:0 0 0 10px #1d1630,0 30px 80px rgba(0,0,0,.45)}}
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 14px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,var(--p1),var(--p2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.who small{display:block;font-size:12.5px;color:var(--sub)}
.who b{display:block;font-size:19px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 14px rgba(90,60,170,.12)}
main{flex:1;padding:0 20px calc(110px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sh h2{margin:0;font-size:20px;color:var(--ink)}
.count{font-size:13px;color:var(--sub)}
.list{display:grid;gap:12px;margin-bottom:22px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:24px;padding:10px;box-shadow:0 8px 24px rgba(90,60,170,.08)}
.th{position:relative;flex:0 0 auto;width:76px;height:76px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,var(--g1),var(--g2))}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.inf{flex:1;min-width:0}
.inf h3{margin:0 0 3px;font-size:14px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inf p{margin:0 0 6px;font-size:12px;color:var(--sub)}
.inf b{font-size:15px;color:var(--ink);white-space:nowrap}
.rm{flex:0 0 auto;width:40px;height:40px;border-radius:14px;border:0;background:var(--field);color:#d0426a;display:grid;place-items:center}
.card{background:linear-gradient(160deg,var(--card),var(--field));border-radius:28px;padding:18px 16px;margin-bottom:18px;box-shadow:0 8px 24px rgba(90,60,170,.08)}
.card h4{margin:0 0 12px;font-size:15px;color:var(--ink)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;border:2px solid transparent;border-radius:18px;padding:10px 8px;font-size:13px;font-weight:600;background:var(--card);color:var(--sub)}
.chip.on{background:linear-gradient(180deg,var(--p1),var(--p2));color:#fff}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:24px;padding:0 16px;height:52px;border:2px solid transparent;box-shadow:0 6px 14px rgba(90,60,170,.08);color:var(--sub)}
.field:focus-within{border-color:var(--p1)}
.field input{flex:1;min-width:0;border:0;background:none;outline:0;font:inherit;font-size:15px;color:var(--ink)}
.field input::placeholder{color:var(--sub);opacity:.85}
.hint{font-size:12px;color:var(--sub);margin:8px 8px 0}
.err{min-height:18px;margin:8px 8px 0;font-size:12.5px;font-weight:600;color:#d0426a}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);margin-bottom:8px}
.row b{color:var(--ink)}
.row.tot{margin:12px 0 0;padding-top:12px;border-top:1px solid rgba(107,100,144,.25);font-size:16px}
.row.tot b{font-size:19px}
.btn{width:100%;height:56px;border:0;border-radius:28px;font-weight:600;font-size:17px;color:#fff;background:linear-gradient(180deg,var(--p1),var(--p2));box-shadow:0 10px 20px rgba(130,100,220,.5),inset 0 2px 4px rgba(255,255,255,.4);transition:transform .12s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.7}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:r .7s linear infinite;display:none}
.load .spin{display:block}@keyframes r{to{transform:rotate(360deg)}}
.center{text-align:center;padding:20px 6px}
.okc{width:84px;height:84px;border-radius:50%;margin:10px auto 18px;display:grid;place-items:center;background:linear-gradient(145deg,var(--p1),var(--p2));box-shadow:0 14px 24px rgba(110,80,200,.4);color:#fff}
.center h3{margin:0 0 8px;font-size:20px;color:var(--ink)}
.center p{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--sub)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.nav{position:fixed;left:0;right:0;margin:0 auto;bottom:0;width:100%;max-width:430px;height:calc(66px + env(safe-area-inset-bottom,0px));z-index:10;display:grid;grid-template-columns:repeat(5,1fr);--cx:70%}
.nav{filter:drop-shadow(0 -3px 8px rgba(70,40,150,.12))}
.bar{position:absolute;inset:0;background:var(--card);border-radius:28px 28px 0 0;-webkit-mask:radial-gradient(circle 37px at var(--cx) 4px,transparent 36px,#000 37px);mask:radial-gradient(circle 37px at var(--cx) 4px,transparent 36px,#000 37px)}
.nav button{position:relative;border:0;background:none;padding:6px 0 env(safe-area-inset-bottom,0px);color:var(--sub);display:grid;place-items:center}
.nav .ic{display:grid;place-items:center;width:44px;height:44px}
.nav svg{width:24px;height:24px}
.nav .on{color:#fff}
.nav .on .ic{position:absolute;top:-24px;left:50%;margin-left:-28px;width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--p1),var(--p2));box-shadow:0 8px 16px rgba(110,80,200,.45)}
.bd{position:absolute;top:10px;right:calc(50% - 24px);min-width:18px;height:18px;border-radius:9px;background:#e5578a;color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.nav .on .bd{top:-24px;right:calc(50% - 30px)}
@media(min-width:500px) and (min-height:640px) and (hover:hover) and (pointer:fine){.nav{position:sticky;left:auto;right:auto;width:auto;max-width:none;margin:auto 0 0}main{padding-bottom:30px!important}}
/* Rotation : pas de cadre ni de rognage sur mobile/tablette (écrans tactiles) */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media(min-width:500px) and (hover:none),(min-width:500px) and (pointer:coarse){.app,.nav{max-width:760px}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);max-width:90vw;transform:translate(-50%,30px);background:#2e2160;color:#fff;padding:12px 20px;border-radius:24px;font-size:13.5px;text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.av.ph{color:transparent;font-size:0}
[hidden]{display:none!important}
.plan{display:block;width:100%;text-align:left;font:inherit;color:inherit;border:2px solid transparent;cursor:pointer}.plan.on{border-color:#8c6fe0}.plan .r{display:flex;justify-content:space-between;gap:8px}.plan small{color:var(--sub)}.plan em{font-style:normal;font-size:11px;font-weight:700;color:#fff;background:#2fa883;border-radius:10px;padding:2px 8px;margin-left:6px}
.cxl{display:block;margin:14px 0 0;padding:4px 0;border:0;background:none;color:#d0426a;font-weight:600;font-size:13.5px;text-decoration:underline}
.cxlbox{margin-top:12px;padding:14px;border-radius:20px;background:var(--field)}
.cxlbox p{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:var(--ink)}
.cxlbtns{display:flex;gap:8px}
.mini{flex:1;height:46px;border:0;border-radius:23px;font-weight:600;font-size:14px}
.mini.keep{background:var(--card);color:var(--ink)}.mini.del{background:#d0426a;color:#fff}.mini:disabled{opacity:.7}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="who"><div class="av" id="av">E</div><div style="min-width:0"><small>Bientôt disponible</small><b>Abonnement</b></div></div>
    <button class="ib" id="bell" type="button" aria-label="Notifications"><svg width="22" height="22" viewBox="0 0 24 24"><path id="p-bell"/></svg></button>
  </header>
  <main>
    <section id="vSoon" class="center">
      <div class="okc"><svg width="40" height="40" viewBox="0 0 24 24"><path id="p-ok"/></svg></div>
      <h3>Bientôt disponible</h3>
      <p>Les abonnements et les paiements seront bientôt disponibles. En attendant, tous les cours et toutes les ressources sont gratuits.</p>
      <div id="plans" style="width:100%;margin:0 0 14px"></div>
      <button class="btn" id="goCat" type="button">Voir le catalogue</button>
    </section>
  </main>
  <nav class="nav" id="nav"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="data.js"></script>
<script>
$("p-bell").setAttribute("d",IC.bell);
var ok=$("p-ok");ok.setAttribute("d",IC.ok);ok.setAttribute("fill","none");ok.setAttribute("stroke","#fff");ok.setAttribute("stroke-width","3");ok.setAttribute("stroke-linecap","round");ok.setAttribute("stroke-linejoin","round");
var n0=userName();if(n0)$("av").textContent=n0.charAt(0).toUpperCase();
function nav(){drawNav(4)}
$("plans").innerHTML=PLANS.map(function(x){return '<div class="card plan"><div class="r"><b>'+x.n+'</b><b>Bientôt disponible</b></div><small>'+x.d+' jours</small></div>'}).join("");
$("bell").onclick=function(){toast("Aucune nouvelle notification")};
$("goCat").onclick=function(){location.href="catalogue.html"};
$("nav").onclick=navClick;
nav();
</script>
</body>
</html>
